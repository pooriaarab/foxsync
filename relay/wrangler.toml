# The foxsync relay at https://foxsync-relay.hello-fd1.workers.dev.
# .github/workflows/deploy.yml deploys it on a push to release.
name = "foxsync-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "BOXES"
class_name = "Box"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Box"]

# 600 requests a minute per address. A desktop that polls every 1.5 s
# makes 40, and a cancelled pairing keeps polling until its code
# expires, so one address can have several polls at once.
[[ratelimits]]
name = "LIMIT"
namespace_id = "5001"
simple = { limit = 600, period = 60 }
