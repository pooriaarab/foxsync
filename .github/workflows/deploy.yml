# Deploys the phone page (host/) and the relay (relay/) to Cloudflare
# Workers when release moves, so the hosted page comes from git.
#   https://foxsync-phone.hello-fd1.workers.dev
#   https://foxsync-relay.hello-fd1.workers.dev
name: Deploy

on:
  push:
    branches: [release]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only the two deploy steps get the token: install and ci:local run
      # npm code that must not read a Workers Scripts Write token.
      - name: Refuse to run without the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the secret CLOUDFLARE_API_TOKEN (Workers Scripts Write) and the variable CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:local
      - name: Deploy the relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: relay
        run: pnpm dlx wrangler@4.150.0 deploy
      - name: Deploy the phone page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: host
        run: pnpm dlx wrangler@4.150.0 deploy
      - name: Check the live URLs
        run: |
          page=$(curl -sS -o /dev/null -w '%{http_code}' https://foxsync-phone.hello-fd1.workers.dev/)
          script=$(curl -sS -o /dev/null -w '%{http_code}' https://foxsync-phone.hello-fd1.workers.dev/phone.js)
          relay=$(curl -sS -o /dev/null -w '%{http_code}' https://foxsync-relay.hello-fd1.workers.dev/v1/AAAAAAAAAAAAAAAAAAAAAA/a)
          echo "phone page $page, phone.js $script, empty relay box $relay"
          [ "$page" = 200 ] && [ "$script" = 200 ] && [ "$relay" = 404 ]
